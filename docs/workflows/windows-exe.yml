name: Build Windows Exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Ensure WiX (jpackage needs WiX 3 for .exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          refreshenv

      - name: Build launcher jar
        shell: pwsh
        run: ./gradlew.bat jar --no-daemon

      - name: Parse version
        shell: pwsh
        run: |
          $m = Select-String -Path build.gradle -Pattern "version = '([^']+)'"
          $v = $m.Matches[0].Groups[1].Value
          if (-not $v) { $v = '0.0.0' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: jpackage -> HavocLauncher installer exe
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name HavocLauncher `
            --app-version $env:VERSION `
            --vendor "HavocMC" `
            --description "Launcher for Minecraft with HavocClient" `
            --icon HavocLauncher.ico `
            --input build/libs `
            --main-jar havoclauncher-$env:VERSION.jar `
            --java-options "-Xms128m" `
            --win-menu `
            --win-menu-group "HavocMC" `
            --win-shortcut `
            --win-dir-chooser `
            --dest build/exe

      - name: Upload exe artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: HavocLauncher-exe
          path: build/exe/*.exe

      - name: Attach jar + exe to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "HavocLauncher $tag" --notes "HavocLauncher $tag - installer exe + runnable jar."
          }
          gh release upload $tag build/exe/*.exe --clobber
          gh release upload $tag build/libs/*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
